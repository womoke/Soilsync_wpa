name: # Rechecked after enabling GitHub Actions

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  process-unclaimed-accounts:
    runs-on: ubuntu-latest
    steps:
      - name: Run due lifecycle jobs
        env:
          API_URL: ${{ secrets.SOILSYNC_API_URL }}
          JOB_TOKEN: ${{ secrets.UNCLAIMED_LIFECYCLE_JOB_TOKEN }}
        run: |
          set -eu
          test -n "$API_URL" || { echo "SOILSYNC_API_URL is required"; exit 1; }
          test -n "$JOB_TOKEN" || { echo "UNCLAIMED_LIFECYCLE_JOB_TOKEN is required"; exit 1; }
          API_URL="${API_URL%/}"
          for job in unclaimed-reminders unclaimed-cleanup; do
            curl --fail-with-body --silent --show-error --retry 2 --retry-delay 5 \
              --request POST \
              --header "X-SoilSync-Job-Token: $JOB_TOKEN" \
              "$API_URL/api/v1/jobs/$job"
            printf '\n'
          done
